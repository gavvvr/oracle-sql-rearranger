name: Maven CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MAVEN_ARGS: --batch-mode --no-transfer-progress --color=always

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
      - name: Build with Maven
        run: mvn verify
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2026.1
        with:
          upload-result: true
      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |-
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.organization=gavvvr \
            -Dsonar.projectKey=gavvvr_oracle-sql-rearranger \
            -Dsonar.sources=. \
            -Dsonar.tests=. \
            -Dsonar.test.inclusions=**/src/test/**/* \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.sarifReportPaths=${{ runner.temp }}/qodana/results/qodana.sarif.json
